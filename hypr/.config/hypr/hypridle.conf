general {
    before_sleep_cmd = /home/immortalforest/.config/quickshell/astralis/scripts/idle-dim release; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300
    on-timeout = /home/immortalforest/.config/quickshell/astralis/scripts/idle-dim dim
    on-resume = /home/immortalforest/.config/quickshell/astralis/scripts/idle-dim restore
}

listener {
    timeout = 900
    on-timeout = /home/immortalforest/.config/quickshell/astralis/scripts/idle-dim release; hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = systemd-inhibit --list --no-legend | grep -q astralis-screen-off || hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
