general {
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300
    on-timeout = sh -c 'cur=$(brightnessctl get); mx=$(brightnessctl max); t=$((cur*2/5)); lo=$((mx/100)); [ "$t" -lt "$lo" ] && t="$lo"; brightnessctl -s set "$t"'
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = systemd-inhibit --list --no-legend | grep -q astralis-screen-off || hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
