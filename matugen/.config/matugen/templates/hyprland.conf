# astralis — Hyprland colors, generated by matugen. Do not edit by hand.
# Rendered on every `matugen image <wallpaper>`; post_hook runs `hyprctl reload`.
# Source it from hyprland.conf/.lua:  source = ~/.config/hypr/colors.conf
# Every M3 role is emitted as an rgba() variable named $<role> (e.g. $primary, $surface).

$image = {{image}}
<* for name, value in colors *>
${{name}} = rgba({{value.default.hex_stripped}}ff)
<* endfor *>
