; astralis — spicetify "Sleek" color scheme (M3 baseline), generated by matugen.
; Do not edit by hand — regenerated on every wallpaper change via
; ~/.config/matugen/config.toml [templates.spotify]. Edit this template instead.
;
; Design intent (revised): Sleek pipes several of these keys into LARGE
; surfaces (main-secondary alone paints the search bar, every card, and both
; hover-highlight vars), so mapping an accent there floods the UI with one
; loud colour. Instead the big-surface keys ride the M3 dark *surface ladder*
; (surface < surface_container < _high < _highest < surface_variant) for quiet,
; layered greys, and the wallpaper accent (primary) is spent only where an
; accent belongs: the main play button and the playback/seek + volume fill.
; Semantic red (error) stays on the error notification. shadow -> the real M3
; shadow role (near-black), not on_surface (that made shadows glow).
;
; Spicetify color.ini wants hex WITHOUT a leading '#' -> use .hex_stripped.
[Astralis]
text               = {{colors.on_surface.default.hex_stripped}}
subtext            = {{colors.on_surface_variant.default.hex_stripped}}
nav-active-text    = {{colors.primary.default.hex_stripped}}
main               = {{colors.surface.default.hex_stripped}}
sidebar            = {{colors.surface.default.hex_stripped}}
player             = {{colors.surface.default.hex_stripped}}
card               = {{colors.surface_container.default.hex_stripped}}
shadow             = {{colors.shadow.default.hex_stripped}}
main-secondary     = {{colors.surface_container_high.default.hex_stripped}}
button-secondary   = {{colors.surface_container_high.default.hex_stripped}}
button-active      = {{colors.surface_container_highest.default.hex_stripped}}
button             = {{colors.surface_container_highest.default.hex_stripped}}
button-disabled    = {{colors.surface_variant.default.hex_stripped}}
nav-active         = {{colors.surface_container_high.default.hex_stripped}}
play-button        = {{colors.primary.default.hex_stripped}}
tab-active         = {{colors.surface_container_highest.default.hex_stripped}}
notification       = {{colors.surface_container_high.default.hex_stripped}}
notification-error = {{colors.error.default.hex_stripped}}
playback-bar       = {{colors.primary.default.hex_stripped}}
misc               = {{colors.on_surface_variant.default.hex_stripped}}

; Description (from upstream Sleek color.ini):
; text             = main text, playlist names in main field, name of playlist selected in sidebar, headings
; subtext          = text in main buttons in sidebar, playlist names in sidebar, artist names, and mini infos
; nav-active-text  = text in main buttons in sidebar when active
; main             = main bg
; main-secondary   = bg color of selected song rows, bg color of artist/track cards
; sidebar          = sidebar bg
; player           = player bg
; card             = popup-card bg
; shadow           = all shadows
; button           = playlist buttons bg in sidebar, drop-down menus, now playing song, like button
; button-secondary = download and options button
; button-active    = hover on song selected
; button-disabled  = seekbar bg, volume bar bg, scrollbar
; nav-active       = sidebar buttons bg
; play-button      = color of main play button in main field
; tab-active       = button bg in main field (playlists, podcasts, artists, albums)
; notification     = notification ('Added to liked songs' etc.)
; playback-bar     = seekbar fg, volume bar fg, main play/pause button
; misc             = miscellaneous
